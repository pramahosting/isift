server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
  location /embed/ { alias /usr/share/nginx/html/; try_files /index.html =404; add_header X-Content-Type-Options nosniff always; add_header Content-Security-Policy "frame-ancestors *" always; }
  location = /embed.js { add_header Cache-Control "public, max-age=300"; }
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /docs { proxy_pass http://backend:8000/docs; }
  location /openapi.json { proxy_pass http://backend:8000/openapi.json; }
  location / { try_files $uri $uri/ /index.html; }
}
